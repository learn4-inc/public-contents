<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>disabled 属性のデモ</title>
  <link rel="stylesheet" href="09-disabled.css">
</head>
<body>
  <h1>button の disabled 属性</h1>
  <p>disabled を付けると要素が無効化され、クリックできず送信データにも含まれません。</p>
  <form action="#" method="get">
    <button type="submit">送信</button>
    <button type="button" disabled>利用できません</button>
  </form>
</body>
</html>
