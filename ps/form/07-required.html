<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>required 属性のデモ</title>
  <link rel="stylesheet" href="07-required.css">
</head>
<body>
  <h1>input の required 属性</h1>
  <p>required を付けると必須になります。空のまま送信するとブラウザがエラーを表示して送信を止めます。</p>
  <form action="#" method="get">
    <label for="email">メールアドレス:</label>
    <input type="email" id="email" name="email" required />
    <button type="submit">送信</button>
  </form>
</body>
</html>
