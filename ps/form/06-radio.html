<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>input type="radio" のデモ</title>
  <link rel="stylesheet" href="06-radio.css">
</head>
<body>
  <h1>input type="radio"</h1>
  <p>ラジオボタン。同じ name のなかから1つだけ選択できます。M には checked を付けています。</p>
  <form action="#" method="get">
    <label><input type="radio" name="size" value="S" /> S</label>
    <label><input type="radio" name="size" value="M" checked /> M</label>
    <label><input type="radio" name="size" value="L" /> L</label>
    <button type="submit">送信</button>
  </form>
</body>
</html>
