<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>position: relative のデモ</title>
  <link rel="stylesheet" href="02-relative.css">
</head>
<body>
  <h1>position: relative のデモ</h1>
  <p>position: relative は、元の位置を基準に要素を移動させます。要素が移動しても、他の要素の位置は変わりません。</p>
  
  <div class="container">
    <div class="item item1">Item 1（通常位置）</div>
    <div class="item item2">Item 2（relative: top: 20px, left: 30px）</div>
    <div class="item item3">Item 3（通常位置）</div>
  </div>
  
  <p class="note">※ Item 2が元の位置から下に20px、右に30px移動していますが、Item 3の位置は変わりません。</p>
</body>
</html>
