<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>:nth-child() のデモ</title>
  <link rel="stylesheet" href="03-nth-child.css">
</head>
<body>
  <h1>:nth-child()</h1>
  <p>n番目の子要素を選択します（テーブルの縞模様など）。</p>
  <table>
    <thead>
      <tr>
        <th>商品</th>
        <th>価格</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>りんご</td><td>100円</td></tr>
      <tr><td>バナナ</td><td>80円</td></tr>
      <tr><td>みかん</td><td>120円</td></tr>
      <tr><td>ぶどう</td><td>300円</td></tr>
    </tbody>
  </table>
</body>
</html>
